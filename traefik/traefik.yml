global:
    checkNewVersion: true
    sendAnonymousUsage: false

log:
    level: debug

api:
    dashboard: true
    insecure: true

entryPoints:
    web:
        address: :80
        http:
            redirections:
                entryPoint:
                    to: websecure
                    scheme: https
    websecure:
        address: :443

accessLog:
    filePath: /var/log/traefik/access.log

# tls:
#     stores:
#         default: {}

providers:
    docker:
        endpoint: 'unix:///var/run/docker.sock'
        defaultRule: Host(`{{ normalize .Name }}.localhost`)
        exposedByDefault: false
        network: traefik

    file:
        directory: /etc/traefik/dynamic
        watch: true
